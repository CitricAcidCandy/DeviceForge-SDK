[workspace]
members = [
    "rust/plugin-sdk",
    "rust/plugin-runtime",
    "rust/plugin-dependencies",
    "rust/examples/protocol4-echo",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CitricAcidCandy/DeviceForge-SDK"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
apk-plugin-sdk = { version = "0.1.0", path = "rust/plugin-sdk" }
deviceforge-plugin-runtime = { version = "0.1.0", path = "rust/plugin-runtime" }
deviceforge-plugin-dependencies = { version = "0.1.0", path = "rust/plugin-dependencies" }

# 开发与测试复用有限的生成物，不保留大型调试信息或增量缓存。
[profile.dev]
debug = 0
incremental = false
codegen-units = 16

[profile.test]
debug = 0
incremental = false
codegen-units = 16
